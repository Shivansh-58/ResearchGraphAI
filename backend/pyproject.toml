[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchgraph-ai"
version = "0.2.0"
description = "Graph-RAG knowledge assistant with hybrid retrieval and graph expansion"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8,<2"]
semantic = ["sentence-transformers>=3,<6"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
respect-gitignore = false
extend-exclude = [".venv", "**/tests/runtime", "**/tests/.tmp", "pytest-cache-files-*"]

[tool.ruff.lint.isort]
known-first-party = ["app", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
